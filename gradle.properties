# Gradle daemon and JVM settings (S01-05).

# Pin the Java toolchain resolution to JDK 25 (see build.gradle.kts). Do not
# download a JDK on demand: a missing or incompatible JDK must fail the build
# explicitly and fast rather than silently hanging on a network fetch, so CI
# (which has no internet) reports the mismatch instead of waiting.
org.gradle.java.installations.auto-download=false

# Discover JDKs in the standard OS locations (for example
# C:\Program Files\Java) so the pinned toolchain resolves locally.
org.gradle.java.installations.auto-discover=true
