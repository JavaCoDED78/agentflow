# Kubernetes / production-like environment (S01-17).
#
# Bind to all interfaces so the container is reachable through the Service.
# Secrets (datasource password, Keycloak client secret, AI API key) are injected
# as environment variables from Kubernetes Secrets, never written into this file.
# There are no hardcoded localhost addresses.

spring:
  application:
    name: agentflow-app
  # Redis auth (S12-16). Read by RedisConnectionConfiguration; set from the AGENTFLOW_REDIS_PASSWORD
  # Secret (Kubernetes). No default on purpose: a missing secret fails boot loudly instead of
  # silently connecting without auth (invariant 8: no secrets, fail loud).
  redis:
    password: ${AGENTFLOW_REDIS_PASSWORD}

agentflow:
  app-name: agentflow-app
  http:
    host: 0.0.0.0
    port: 8080
  security:
    # REQUIRED in Kubernetes: the Keycloak issuer URI (the realm URL) that signs the access
    # tokens. No default is given on purpose — a missing AGENTFLOW_KEYCLOAK_ISSUER_URI fails boot
    # loudly instead of silently validating against the base-profile placeholder. The audience is
    # the `aud` the API expects (the agentflow-api OIDC client).
    issuer-uri: ${AGENTFLOW_KEYCLOAK_ISSUER_URI}
    audience: agentflow-api
  # Kafka outbound producer (S06-09). Enabled in Kubernetes; bootstrap-servers come from the
  # AGENTFLOW_KAFKA_BOOTSTRAP Secret (the kafka service DNS). The reliability settings match
  # AgentFlowProperties.Kafka.Producer. The producer is disabled in the base/test profiles so the
  # skeleton boots without Kafka (S01-02).
  kafka:
    producer:
      enabled: true
      bootstrap-servers: ${AGENTFLOW_KAFKA_BOOTSTRAP:kafka:9092}
      acks: all
      # delivery.timeout.ms must exceed linger.ms + request.timeout.ms (Kafka's default
      # request.timeout.ms is 30s, linger.ms 5); 60s keeps a comfortable margin. Setting 30s
      # here would make the KafkaProducer constructor reject the config
      # (ConfigException) and fail the bean.
      delivery-timeout-seconds: 60
      retries: 3
      retry-backoff-ms: 100
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
      compression-type: none

  # Redis client (S12-16, ADR-021). Enabled in Kubernetes; the connection is created by
  # RedisConnectionConfiguration from these values. host comes from the redis service DNS
  # (AGENTFLOW_REDIS_HOST); the timeout bounds keep a blocked Redis from hanging a virtual thread.
  # The password is read from spring.redis.password (see the spring.redis block), set from the
  # AGENTFLOW_REDIS_PASSWORD Secret, never hardcoded here. RedisAutoConfiguration stays excluded
  # (inherited from the base profile), so RedisConnectionConfiguration is the sole connection
  # creator.
  redis:
    enabled: true
    host: ${AGENTFLOW_REDIS_HOST:redis}
    port: ${AGENTFLOW_REDIS_PORT:6379}
    tls: false
    connect-timeout-seconds: 5
    command-timeout-seconds: 5

# Redis non-critical health group (S12-17, ADR-021). The 'redis' contributor (the
# redisHealthIndicator bean) exists only when Redis is enabled (this profile), so it is safe to
# reference it here. It is grouped under the non-critical 'cache' group and is deliberately NOT part
# of readiness/liveness (the base profile keeps those empty of app indicators); it is reachable via
# /health/redis as an operator observation, so a down Redis can never drop the pod or reroute
# traffic.
management:
  endpoint:
    health:
      group:
        cache:
          include: redis

# Swagger UI is a development aid for local API exploration and must not be reachable from the
# cluster. Only the interactive UI is disabled here; the OpenAPI description can stay enabled.
springdoc:
  swagger-ui:
    enabled: false
