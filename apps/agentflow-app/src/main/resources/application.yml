# Base configuration for the AgentFlow Spring Boot artifact (S01-07, S01-17).
#
# Shared across every environment. Per-environment overrides live in
# application-{local,test,kubernetes}.yml. There are no hardcoded localhost
# addresses here: the HTTP bind comes from the validated typed properties
# (agentflow.http.*) and secrets arrive from the environment.
#
# Persistence, messaging and identity arrive in later sprints (S03+), so the
# skeleton boots without a database.

spring:
  application:
    name: agentflow-app
  # Schema migrations (S03-01): apply on an explicit step only
  # (./gradlew flywayMigrate locally, a controlled Helm Job in Kubernetes),
  # never on application startup. The service must be able to boot before the
  # database is reachable, and replicas must not migrate concurrently. Enable
  # startup migration in a profile only if a later task needs it.
  flyway:
    enabled: false
    locations: classpath:migrations
  # The one thing that would stop the skeleton from booting without a database
  # is spring-boot-starter-jdbc's DataSource auto-configuration (S03-08): it
  # creates a HikariDataSource eagerly and FAILS ("Failed to determine a suitable
  # driver class") when no spring.datasource.* is configured. Exclude it here so
  # the default profile still boots without a database (S01-02). The local profile
  # re-enables it (spring.autoconfigure.exclude: []) once spring.datasource.* is
  # supplied from the environment, and the integration suites that need a real
  # database configure their own DataSource (Testcontainers) later.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

# AgentFlow typed configuration (S01-17). Validated at startup through
# @ConfigurationProperties + @Validated; a missing required value (agentflow.app-name)
# fails boot with a clear message. The HTTP bind settings drive the embedded
# server via HttpServerConfiguration.
agentflow:
  # Required: no Java default, so a missing value fails startup explicitly.
  app-name: agentflow-app
  http:
    # Bind all interfaces by default so the container is reachable through the
    # Kubernetes Service. Never hardcode localhost here or in code.
    host: 0.0.0.0
    port: 8080

# Health endpoints (S01-18).
#
# Boot 4.x exposes web endpoints through an allow-list
# (`management.endpoints.web.exposure.include`). Only `health` and `info` are
# reachable over HTTP; every other endpoint (`env`, `configprops`, `beans`,
# `mappings`, `loggers`, dumps) is not exposed, so it answers 404 anonymously.
# `liveness` and `readiness` are dedicated health probes for the orchestrator
# (Kubernetes). Role-based access is added later (S04-11); this is least
# exposure.
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  health:
    group:
      liveness:
        include: []
      readiness:
        include: []

# OpenAPI contract (S03-12). The description is generated deterministically from the running
# application and checked in under contracts/openapi/; the generation order is stable, so a diff
# shows only real changes. It is served under the /api/v1 REST prefix and Swagger UI (local
# exploration) is toggled per profile (disabled in the kubernetes profile).
springdoc:
  api-docs:
    path: /api/v1/v3/api-docs
  swagger-ui:
    enabled: true
