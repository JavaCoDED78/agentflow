# Base configuration for the AgentFlow Spring Boot artifact (S01-07, S01-17).
#
# Shared across every environment. Per-environment overrides live in
# application-{local,test,kubernetes}.yml. There are no hardcoded localhost
# addresses here: the HTTP bind comes from the validated typed properties
# (agentflow.http.*) and secrets arrive from the environment.
#
# Persistence, messaging and identity arrive in later sprints (S03+), so the
# skeleton boots without a database.

spring:
  application:
    name: agentflow-app
  # Schema migrations (S03-01): apply on an explicit step only
  # (./gradlew flywayMigrate locally, a controlled Helm Job in Kubernetes),
  # never on application startup. The service must be able to boot before the
  # database is reachable, and replicas must not migrate concurrently. Enable
  # startup migration in a profile only if a later task needs it.
  flyway:
    enabled: false
    locations: classpath:migrations
  # The one thing that would stop the skeleton from booting without a database
  # is spring-boot-starter-jdbc's DataSource auto-configuration (S03-08): it
  # creates a HikariDataSource eagerly and FAILS ("Failed to determine a suitable
  # driver class") when no spring.datasource.* is configured. Exclude it here so
  # the default profile still boots without a database (S01-02). The local profile
  # re-enables it (spring.autoconfigure.exclude: []) once spring.datasource.* is
  # supplied from the environment, and the integration suites that need a real
  # database configure their own DataSource (Testcontainers) later.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      # Redis auto-configuration (S12-16, ADR-021). The starter bundles several auto-configs and
      # all of them are excluded so the skeleton boots and passes readiness with no Redis running
      # and no Redis bean exists: DataRedisAutoConfiguration (the blocking LettuceConnectionFactory),
      # DataRedisReactiveAutoConfiguration (a default RedisClient pointed at localhost:6379, plus the
      # reactive repositories), DataRedisRepositoriesAutoConfiguration (the repository infrastructure
      # that would otherwise demand a redisTemplate), and the two health contributors (the indicators
      # that probe localhost:6379 and would fail the readiness probe). When a profile enables the
      # client (agentflow.redis.enabled=true), RedisConnectionConfiguration is the sole creator of the
      # RedisConnectionFactory bean — never Spring Boot's auto-configuration.
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration

# AgentFlow typed configuration (S01-17). Validated at startup through
# @ConfigurationProperties + @Validated; a missing required value (agentflow.app-name)
# fails boot with a clear message. The HTTP bind settings drive the embedded
# server via HttpServerConfiguration.
agentflow:
  # Required: no Java default, so a missing value fails startup explicitly.
  app-name: agentflow-app
  http:
    # Bind all interfaces by default so the container is reachable through the
    # Kubernetes Service. Never hardcode localhost here or in code.
    host: 0.0.0.0
    port: 8080
  security:
    # OAuth 2.0 resource server (S04-03). The issuer is the Keycloak realm URL that
    # issues and signs the access tokens; the audience is the `aud` the API expects
    # (the agentflow-api OIDC client). Both come from the environment (AGENTFLOW_KEYCLOAK_ISSUER_URI);
    # the defaults below are non-production placeholders so the skeleton still boots
    # without a reachable Keycloak. They MUST be overridden for a real deployment
    # (see application-kubernetes.yml and the local .env).
    issuer-uri: ${AGENTFLOW_KEYCLOAK_ISSUER_URI:https://keycloak.example/realms/agentflow}
    audience: agentflow-api
  # Polling outbox publisher (S06-07). Bounded batch claimed per poll; bounded-retry
  # exponential backoff (capped) before a row is held terminal for the DLQ (S06-11).
  outbox:
    publisher:
      batch-size: 50
      max-attempts: 5
      base-delay-seconds: 1
      max-delay-seconds: 60
      # Stale-claim timeout (S06-08): a CLAIMED row un-acked longer than this is treated as a
      # publisher that crashed after claiming (crash-after-publish-before-DB-update window) and is
      # re-published. Generous on purpose so a live, slow publisher keeps its claim; re-publishing a
      # row the broker already holds is a duplicate (inbox-deduped, S06-10), never a loss.
      claim-timeout-seconds: 300
  # Bounded tool executor (S08-10). The pool the tool calls run on plus the global / per-tenant
  # concurrency caps; a call beyond a cap is rejected immediately with a `concurrency_limited`
  # outcome, never queued. The per-tool timeout itself is part of every ToolDescriptor (S08-01),
  # not of this configuration. Limits live here, not in code.
  tools:
    executor:
      pool-size: 8
      global-max-concurrency: 32
      per-tenant-max-concurrency: 8
  # Object storage (Garage, S3-compatible) settings (S10-02). Bound from agentflow.storage.* and
  # consumed by the S3 client built in S10-05. The bucket and the private (no public URL) policy are
  # fixed here; the endpoint is environment-specific and supplied per profile (local / kubernetes),
  # never hardcoded here. The S3 credentials come from the environment, never from configuration
  # (invariant 8). The bucket is private by default (public-access: disabled): objects are read and
  # written only through the app, never via a public or anonymous URL (the S10-02 acceptance).
  storage:
    bucket: agentflow
    region: garage
    public-access: disabled
  # Redis client (S12-16, ADR-021). Opt-in: disabled by default so the skeleton boots and passes
  # readiness with no Redis running and no connection bean exists. A profile (local / kubernetes)
  # sets agentflow.redis.enabled=true; the agentflow.redis.* host/port/tls/timeouts below are bound
  # by AgentFlowProperties.Redis and consumed by RedisConnectionConfiguration, which is the sole
  # connection creator (RedisAutoConfiguration is excluded above). Credentials are read from the
  # environment (spring.redis.password), never from here — the typed config carries no password
  # field, so it can never reach the configprops Actuator, the logs or the connection factory
  # toString (S12-16 acceptance).
  redis:
    # Disabled by default (matches the typed config default). Set to true in a profile to wire the
    # connection factory from the agentflow.redis.* values below.
    enabled: false
    # host is intentionally unset by default (the typed config default is null): it is required
    # only when enabled=true, supplied per profile, and is never a hardcoded localhost
    # (invariant: no localhost).
    host: null
    port: 6379
    tls: false
    connect-timeout-seconds: 5
    command-timeout-seconds: 5
  # Document-upload limits (S10-03). Bound from agentflow.upload.* and consumed by the
  # DocumentUploadValidator the upload API drives. These bounds (payload size, sanitised filename
  # length, and for media the decoded duration) are checked before any byte is written to object
  # storage and before any documents row is committed, so an oversized or unsupported upload is
  # rejected without leaving a dangling object or metadata row. Configured, not magic numbers.
  upload:
    max-bytes: 10485760 # 10 MiB
    max-filename-length: 255
    max-media-duration-seconds: 300 # 5 minutes; applies to media types (audio/wav) only
  # Kafka outbound producer (S06-09). Disabled by default: the skeleton boots without Kafka (S01-02),
  # and the KafkaMessageDeliverer bean only exists when agentflow.kafka.producer.enabled=true. Enable
  # it in a profile (local / kubernetes) with a reachable agentflow.kafka.producer.bootstrap-servers;
  # the reliability tuning (acks / delivery-timeout / retry / batching) lives in
  # AgentFlowProperties.Kafka.Producer. The producer is commented out so the base profile stays
  # disabled and never tries to connect to a broker that is not configured.
  # kafka:
  #   producer:
  #     enabled: false

# Bundled prompt templates and their versions (S09-04). Each prompt is rendered by the
# ai.prompt PromptCatalogue into a fixed SYSTEM policy message plus a single USER message
# carrying the untrusted injected content. The template file lives at resources/ai/<name>.txt;
# its hash is derived from the file content, so editing the template is always detectable.
# Bump the version whenever the template content changes.
ai:
  prompt:
    prompts:
      - name: planner
        version: "1"

usage:
  pricing:
    # S12-03: versioned price catalogue. `revision` is the tag every priced usage record stores as
    # its pricing_revision (so a historical estimate is explainable through the price version);
    # `currency` is used for every estimated cost. Each entry prices one model per its `unit`
    # (token / 1k-tokens / 1m-tokens), effective from `effective`. A model not listed resolves to
    # unknown (never invented). Replace with real catalogue values.
    revision: "pricing-2026-05-01"
    currency: "USD"
    entries:
      - model: "gpt-4o"
        version: "2026-01-01"
        unit: "1k-tokens"
        price: "0.03"
        effective: "2026-01-01"
      - model: "nomic-embed-text"
        version: "v2"
        unit: "1k-tokens"
        price: "0.0001"
        effective: "2026-03-01"

# Health endpoints (S01-18).
#
# Boot 4.x exposes web endpoints through an allow-list
# (`management.endpoints.web.exposure.include`). Only `health` and `info` are
# reachable over HTTP; every other endpoint (`env`, `configprops`, `beans`,
# `mappings`, `loggers`, dumps) is not exposed, so it answers 404 anonymously.
# `liveness` and `readiness` are dedicated health probes for the orchestrator
# (Kubernetes). The secured security chain keeps the health/info probes reachable
# without a token for the orchestrator and requires a bearer token for every
# other management endpoint (S04-11); combined with the allow-list this is least
# exposure.
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          # S13-02: the Prometheus scrape endpoint, for the internal observability stack.
          # It is deliberately NOT permitAll-ed: it stays behind the default-deny secured chain,
          # so a scrape must carry a bearer token (the Prometheus server's Authorization header,
          # from the internal network) and an external anonymous client gets 401. The health/info
          # probes remain permitAll (orchestrator). The internal-network restriction itself is
          # enforced by the Kubernetes NetworkPolicy in the deployment sprint (S15) — the metrics
          # surface never leaves the cluster, and the endpoint is never exposed publicly.
          - prometheus
  metrics:
    # Common tag on every meter (service identity; bounded: one value, the app name).
    tags:
      application: ${spring.application.name}
    # S13-02: disable the instrument groups that add no operational value here. HTTP/JVM/DB-pool
    # metrics (tomcat HTTP server, jvm, hikaricp) stay enabled (Boot auto-configuration defaults).
    # The Redis command latency is off — S13-22 owns the Redis-helper meters; logback event counters
    # are off — logs are JSON on stdout, not per-level metrics; cache is off — no caches configured.
    enable:
      'spring.data.redis': false
      logback: false
      cache: false
    # S13-14: percentile histograms for the HTTP server timer, so the API/JVM/DB
    # dashboard can render p95 latency (histogram_quantile over the bucket series).
    # Default bucket boundaries; the buckets carry only the existing bounded tags.
    # S13-15: the same opt-in for the workflow timers, so the Workflow/Kafka
    # dashboard can render p95/p99 run and step durations.
    distribution:
      percentiles-histogram:
        http.server.requests: true
        agentflow.workflowexecution.run.duration.seconds: true
        agentflow.workflowexecution.step.duration.seconds: true
  # Tracing (S13-03): OpenTelemetry SDK + OTLP exporter, auto-configured by the
  # spring-boot-starter-opentelemetry starter. Every HTTP request becomes a span; the batch
  # exporter posts protobuf to the OTLP endpoint asynchronously, so a missing collector never
  # fails a request. The endpoint itself is profile-supplied (local: AGENTFLOW_OTLP_ENDPOINT);
  # Boot also maps the OTEL_EXPORTER_OTLP_* environment variables onto the same properties.
  # Spans never carry raw request/response bodies (S13-01 standards).
  tracing:
    sampling:
      # Sample every request in dev/test (Boot's default is 10% — parent-based-trace-id-ratio);
      # the kubernetes profile can lower this when the volume demands it.
      probability: 1.0
  opentelemetry:
    resource-attributes:
      # Service identity on every span (S13-01): service.name is the application name (the
      # auto-configured Resource maps spring.application.name); deployment.environment is a
      # bounded, configuration-fixed value (local / test / kubernetes), never taken from a
      # request. Overridable via AGENTFLOW_DEPLOYMENT_ENVIRONMENT.
      deployment.environment: ${AGENTFLOW_DEPLOYMENT_ENVIRONMENT:local}
  otlp:
    metrics:
      export:
        # The starter drags in micrometer-registry-otlp, whose OTLP push export would default
        # to ON (posting to localhost:4318 on a schedule). Metrics ship through the Prometheus
        # scrape endpoint (S13-02), never through OTLP push — keep the push exporter off.
        enabled: false
  health:
    group:
      liveness:
        include: []
      readiness:
        include: []

# OpenAPI contract (S03-12). The description is generated deterministically from the running
# application and checked in under contracts/openapi/; the generation order is stable, so a diff
# shows only real changes. It is served under the /api/v1 REST prefix and Swagger UI (local
# exploration) is toggled per profile (disabled in the kubernetes profile).
springdoc:
  api-docs:
    path: /api/v1/v3/api-docs
  swagger-ui:
    enabled: true
