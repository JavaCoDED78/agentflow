# Local development environment (S01-17).
#
# Activate with:
#   ./gradlew :apps:agentflow-app:bootRun -Dspring.profiles.active=local
#
# Service URLs (datasource, Redis, Kafka, Keycloak, object storage, OTLP) are
# not hardcoded here; they come from the git-ignored local .env file (environment
# variables) mapped onto spring.datasource.* and the agentflow.* keys. The
# datasource is wired by spring-boot-starter-jdbc (S03-08): without it the app
# boots without a database (S01-02). Nothing here points at localhost.

spring:
  application:
    name: agentflow-app
  # Re-enable the DataSource auto-configuration that the base profile excludes
  # (application.yml). DataSource auto-config is NOT listed in the exclude, so it is
  # re-enabled and wires from spring.datasource.* supplied by the environment
  # (git-ignored .env), not from here: nothing here points at a database.
  #
  # A profile's spring.autoconfigure.exclude replaces (not appends to) the base value, so the
  # four DataRedis exclusions from the base profile must be repeated here to stay excluded;
  # RedisConnectionConfiguration is the sole connection creator (S12-16, ADR-021) and no
  # auto-config second bean or health indicator is left pointing at localhost. DataSourceAuto-
  # configuration is intentionally absent so the base exclusion is cleared and the DataSource
  # is wired from spring.datasource.* (the environment), not from here.
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
  # Redis auth (S12-16). Read by RedisConnectionConfiguration from spring.redis.password;
  # set from the git-ignored local .env (AGENTFLOW_REDIS_PASSWORD). Empty when unset (no
  # auth on the local Redis). Never committed.
  redis:
    password: ${AGENTFLOW_REDIS_PASSWORD:}

agentflow:
  app-name: agentflow-app
  http:
    host: 0.0.0.0
    port: 8080
  security:
    # Local Keycloak issuer (from the git-ignored .env, AGENTFLOW_KEYCLOAK_ISSUER_URI). The
    # localhost default below is for local development only and is never shipped to a real
    # profile.
    issuer-uri: ${AGENTFLOW_KEYCLOAK_ISSUER_URI:http://localhost:8083/realms/agentflow}
    audience: agentflow-api
  # Kafka outbound producer (S06-09). Enabled for local runs; disabled by default in the base and
  # test profiles (the skeleton boots without Kafka, S01-02). The bootstrap servers come from the
  # git-ignored local .env (AGENTFLOW_KAFKA_BOOTSTRAP); the localhost default is local development
  # only and is never shipped to a real profile. The reliability settings match
  # AgentFlowProperties.Kafka.Producer (acks / delivery-timeout / retry / batching).
  kafka:
    producer:
      enabled: true
      bootstrap-servers: ${AGENTFLOW_KAFKA_BOOTSTRAP:localhost:9092}
      acks: all
      # delivery.timeout.ms must exceed linger.ms + request.timeout.ms (Kafka's default
      # request.timeout.ms is 30s, linger.ms 5); 60s keeps a comfortable margin. Setting 30s
      # here would make the KafkaProducer constructor reject the config
      # (ConfigException) and fail the bean.
      delivery-timeout-seconds: 60
      retries: 3
      retry-backoff-ms: 100
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
      compression-type: none

  # Object storage (S10-02). The endpoint / bucket / region come from the git-ignored local .env
  # (AGENTFLOW_OBJECT_STORAGE_*); the localhost endpoint is a local-development default and is never
  # shipped to a real profile. The bucket / region match the base profile; the policy stays private
  # (public-access: disabled) so objects are addressed only through the app, never via a public URL.
  storage:
    endpoint: ${AGENTFLOW_OBJECT_STORAGE_ENDPOINT:http://localhost:3900}
    bucket: ${AGENTFLOW_OBJECT_STORAGE_BUCKET:agentflow}
    region: ${AGENTFLOW_OBJECT_STORAGE_REGION:garage}
    public-access: disabled

  # Redis client (S12-16, ADR-021). Enabled for local runs; the connection is created by
  # RedisConnectionConfiguration from these values. host/port come from the git-ignored local
  # .env (AGENTFLOW_REDIS_HOST / AGENTFLOW_REDIS_PORT); the localhost default is local-development
  # only and is never shipped to a real profile. The password is read from spring.redis.password
  # (see the spring.redis block), never hardcoded here.
  redis:
    enabled: true
    host: ${AGENTFLOW_REDIS_HOST:localhost}
    port: ${AGENTFLOW_REDIS_PORT:6379}
    tls: false
    connect-timeout-seconds: 5
    command-timeout-seconds: 5

# Redis non-critical health group (S12-17, ADR-021). The 'redis' contributor (the
# redisHealthIndicator bean) exists only when Redis is enabled (this profile), so it is safe to
# reference it here. It is grouped under the non-critical 'cache' group and is deliberately NOT part
# of readiness/liveness (the base profile keeps those empty of app indicators); it is reachable via
# /health/redis as an operator observation, so a down Redis can never drop the pod or reroute
# traffic.
management:
  endpoint:
    health:
      group:
        cache:
          include: redis
  # OTLP trace exporter (S13-03): the local observability stack's Collector (S13-04, the
  # `observability` compose profile) listens on the standard OTLP port. The common endpoint is
  # used deliberately — Boot appends the signal-specific path (/v1/traces for traces). The
  # localhost default is local development only and never ships to a real profile;
  # AGENTFLOW_OTLP_ENDPOINT overrides it, and the kubernetes profile points at the in-cluster
  # Collector service in the deployment sprint (S15).
  opentelemetry:
    otlp:
      endpoint: ${AGENTFLOW_OTLP_ENDPOINT:http://localhost:4318}

# Log levels for the local profile (S01-19). The JSON layout lives in
# logback-spring.xml; this only picks the level per logger. Our code runs at
# DEBUG for local diagnostics, while framework / boot noise is capped at WARN so
# startup and shutdown stay easy to read.
logging:
  level:
    root: INFO
    com.example.agentflow: DEBUG
    org.springframework.boot.autoconfigure: WARN

