# Local infrastructure as code — runtime stack.
#
# Docker Compose for the AgentFlow runtime: PostgreSQL (+ pgvector, FTS),
# Kafka (KRaft), Redis, Garage and Keycloak. Services are grouped into Compose
# profiles so the minimum viable stack (`core`) starts without the rest.
# Profiles are fully defined in S01-16.
#
# Rules (see infra/AGENTS.md):
#   - Images are pinned to immutable tags, never `latest`.
#   - Secrets are never committed. Defaults below are local-only and clearly
#     marked; override them through a local `.env` (git-ignored).
#   - A healthcheck is present on every service.
#   - The PostgreSQL image with pgvector is the same one Testcontainers uses.
#
# Load a `.env` (local, git-ignored) for real values; the defaults make the
# service runnable without one.

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 18 (+ pgvector, FTS) — source of truth for workflow state (S01-12).
  # pgvector/pgvector: pgvector 0.8.6 built on PostgreSQL 18; the tag pins both
  # the extension and the major version so an unattended pull cannot jump either.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    container_name: agentflow-postgres
    restart: unless-stopped
    environment:
      # Local-development defaults; a real `.env` overrides these.
      POSTGRES_USER: ${POSTGRES_USER:-agentflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentflow-dev}
      POSTGRES_DB: ${POSTGRES_DB:-agentflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Named volume keeps data across restarts. pgdata is owned by uid 999
    # inside the image; the volume is Docker-managed, so nothing lands in Git.
    # PostgreSQL 18 expects the mount at /var/lib/postgresql (the entrypoint then
    # uses a major-version-specific subdir); mounting at /var/lib/postgresql/data
    # is rejected by the 18+ image (see docker-library/postgres#37, #1259).
    volumes:
      - agentflow-pgdata:/var/lib/postgresql
    # /dev/shm sizing: parallel HNSW index builds (pgvector) can need more than
    # the 64 MB default; bump it for local index work.
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentflow} -d ${POSTGRES_DB:-agentflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: ["core"]

  # ---------------------------------------------------------------------------
  # Redis 8 (Open Source) — cache and short-lived coordination (S01-13).
  # Never a source of truth: workflow state lives in PostgreSQL, so losing
  # Redis must not lose a run. Local persistence via AOF on a named volume so
  # dev data survives restarts. No auth on the trusted local network; production
  # (Kubernetes) must enable `requirepass` from a Secret — the password is never
  # hardcoded in app code (acceptance S01-13).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8.10.2
    container_name: agentflow-redis
    restart: unless-stopped
    # Append-only file is the local persistence policy: everysec fsync keeps
    # data loss within one second across a restart, which is enough for an
    # ephemeral cache. The redis-entrypoint runs `redis-server` with these args.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # AOF files live in /data; the named volume keeps them across restarts.
    volumes:
      - agentflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    profiles: ["core"]

  # ---------------------------------------------------------------------------
  # Kafka 4.3.1 (KRaft) — durable event transport (S01-14).
  # Single combined node (broker + controller) on the pinned apache/kafka:4.3.1
  # image, which runs KRaft by default — no ZooKeeper. A dedicated CONTROLLER
  # listener is required by KRaft; INTERNAL carries inter-broker traffic and is
  # advertised as kafka:9092 so compose peers resolve the broker by name. The
  # cluster id is generated once (see README) and referenced through KAFKA_CLUSTER_ID;
  # the wrapper formats the Raft log on the first start. replication-factor 1 is
  # consistent with the broker's min.insync.replicas default.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: agentflow-kafka
    restart: unless-stopped
    environment:
      # KRaft cluster id — generated once; required for first start.
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in .env — run: /opt/kafka/bin/kafka-storage.sh random-uuid}"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    # Named volume keeps the Raft log across restarts; nothing lands in Git.
    volumes:
      - agentflow-kafka:/var/lib/kafka/data
    # The messaging network + `kafka` alias is how peers resolve the advertised
    # listener INTERNAL://kafka:9092.
    networks:
      messaging:
        aliases:
          - kafka
    # Broker-level readiness: the broker must answer the API/versions request on
    # its own INTERNAL listener (localhost, so it does not depend on compose DNS
    # resolving its advertised alias) and have the KRaft metadata loaded. The
    # console tool exits non-zero before the broker is ready, so Compose gates
    # dependents on it.
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    profiles: ["messaging"]

  # ---------------------------------------------------------------------------
  # Garage (S3-compatible object storage) — large documents / artifacts kept
  # outside PostgreSQL (S01-15). Runs in the `core` profile alongside PostgreSQL
  # and Redis. Free and open source (AGPL-3.0), unlike the upstream MinIO AIStor
  # whose pre-built images require a (single-node) SUBNET license to unlock S3 —
  # see docs/adr/s3-object-storage-garage.md. The compose file auto-bootstraps a
  # single-node cluster on first start:
  #   --single-node     applies the cluster layout automatically (no manual
  #                     `layout assign`/`layout apply`)
  #   --default-bucket  creates the `agentflow` bucket and a default S3 access
  #                     key from the environment below (which implies the key)
  # The layout, bucket and key persist in the metadata volume, so restarts
  # reconcile idempotently instead of re-bootstrapping.
  # ---------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: agentflow-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Local-development defaults; a real `.env` overrides these. The root S3
      # key is long-lived by design for an object store. The app's S3 client
      # (minio.access-key / minio.secret-key in the root .env) MUST use the
      # same values so it authenticates against this key.
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:-agentflow}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:-agentflowdevaccess0123456789}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      # RPC secret for intra-node communications; injected here (not committed).
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "${GARAGE_S3_API_PORT:-3900}:3900"
    # Config (ro): no secrets here — rpc_secret is injected via GARAGE_RPC_SECRET.
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      # Metadata (layout, key, bucket) and data volumes keep everything across
      # restarts; nothing lands in Git.
      - agentflow-garage-meta:/var/lib/garage/meta
      - agentflow-garage-data:/var/lib/garage/data
    # Garage ships a CLI health probe: exit 0 when the cluster is HEALTHY.
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    profiles: ["core"]

  # ---------------------------------------------------------------------------
  # Keycloak 26.x (OIDC identity provider) — local IdP + declarative realm
  # import (S01-15). The `identity` profile keeps Keycloak out of the data
  # profiles, so `core`/`messaging` start without an IdP. The realm (and admin
  # account) persist in a named volume across restarts. Local-only defaults;
  # production (Kubernetes) must set the admin password from a Secret.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: agentflow-keycloak
    restart: unless-stopped
    # Local-dev only: run as root. Keycloak 26 defaults to uid 1000, but the
    # `agentflow-keycloak-data` named volume is root-owned on Docker Desktop, so
    # a non-root process cannot write the H2 database (AccessDeniedException).
    # Drop privileges in production via a non-root Kubernetes SecurityContext.
    user: "0"
    environment:
      # Local-development defaults; a real `.env` overrides these.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Allow HTTP for localhost (issuer is http://localhost:8083/realms/agentflow).
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8083"
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8083}:8083"
    volumes:
      # Realm import (ro): --import-realm reads <home>/data/import, so this file
      # lives in a plain (non-volume) dir and is always the repo's copy.
      - ./keycloak/realm-agentflow.json:/opt/keycloak/data/import/realm.json:ro
      # H2 database (Keycloak 26 default: <home>/data/h2) persists across
      # restarts in a named volume.
      - agentflow-keycloak-data:/opt/keycloak/data/h2
    # The image has no curl/wget; a bash /dev/tcp probe against the HTTP port is
    # sufficient for readiness (bash is /bin/sh here).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8083 && printf \"GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && timeout 3 head -c 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    profiles: ["identity"]

volumes:
  agentflow-pgdata:
    name: agentflow-pgdata
  agentflow-redis:
    name: agentflow-redis
  agentflow-kafka:
    name: agentflow-kafka
  agentflow-garage-meta:
    name: agentflow-garage-meta
  agentflow-garage-data:
    name: agentflow-garage-data
  agentflow-keycloak-data:
    name: agentflow-keycloak-data

networks:
  messaging:
    name: agentflow-messaging
    driver: bridge
