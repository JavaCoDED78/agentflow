# AgentFlow version catalog (S01-06).
#
# Single source of truth for every plugin and dependency version in the build.
# No module pins a version inline; it references an entry here through the
# `libs` accessor (for example `plugins { libs.plugins.spring.boot }` or
# `platform(libs.spring.boot.bom)`). Keeping versions in one file means one
# library cannot be pinned to different versions in different build files.
# See DEVELOPMENT_PLAN.md, Sprint 1.

[versions]
# Frameworks / platform. Pinned by DEVELOPMENT_PLAN.md §2 and verified against
# the official releases in S01-08.
spring-boot = "4.1.1"
spring-ai   = "2.0.1"
# Architecture tests (S02-08): ArchUnit enforces the module boundary rules.
# Pinned here like every other version; it is not part of the Spring Boot BOM.
archunit = "1.5.1"
# OpenAPI contract generation (S03-12): springdoc-openapi v3 targets Spring Boot
# 4 (Java 17+, Jakarta EE 9), so it is compatible with the Boot 4.1.1 / Spring
# Framework 7 / Jackson 3 stack used here. The v3 line is the Spring Boot 4
# successor of the v2 (Spring Boot 3) line.
springdoc = "3.1.1"
# Structured JSON logging for the app (S01-19). 9.0 is compiled against logback
# 1.5.x and Jackson 3.x (tools.jackson), so it is compatible with the Boot
# 4.1.1 stack (logback 1.5.38, Jackson 3.1.5). Older 7.x lines still target
# com.fasterxml.jackson (Jackson 2) and would clash with Boot 4.1's Jackson 3.
logstash-logback-encoder = "9.0"

[libraries]
# Bill-of-materials (BOM) artifacts are consumed with platform(...). They carry
# every Spring-managed transitive version, so nothing is re-pinned elsewhere.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-ai-bom   = { module = "org.springframework.ai:spring-ai-bom",               version.ref = "spring-ai" }
# Structured JSON logging (S01-19); version pinned above.
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }
# Schema migrations (S03-01): Flyway Core is BOM-managed by the Spring Boot BOM,
# so no version is pinned here. The PostgreSQL dialect lives in
# flyway-database-postgresql (required from Flyway 10+ — Flyway Core alone no
# longer ships a PostgreSQL dialect) and is likewise BOM-managed.
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# PostgreSQL JDBC driver (S03-01): the Flyway migration task and the app's
# DataSource both need a driver at runtime; starter-jdbc brings the pool
# (HikariCP) but not a database driver, so this is added explicitly. Its version
# is BOM-managed by the Spring Boot BOM.
postgresql = { module = "org.postgresql:postgresql" }
# Architecture tests (S02-08): ArchUnit JUnit 5 aggregator. It provides the
# @ArchTest annotation (archunit-junit5-api, which pulls archunit core as a
# compile dependency so the classes() DSL is on the test compile classpath) and
# the engine needed by the JUnit 5 platform to discover/run @ArchTest fields.
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# OpenAPI contract (S03-12): the Spring WebMvc starter (description + Swagger UI).
# Consumed through the version catalog so the version is pinned in one place; it
# is not part of the Spring Boot BOM.
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# Kafka client (S06-09): the bare `kafka-clients` library (KafkaProducer /
# ProducerRecord / RecordHeader / RecordMetadata) the outbound producer adapter
# uses to forward an outbox envelope to the broker. Only the client library is
# needed — no spring-kafka, no autoconfiguration; the producer is built from the
# same configuration keys Spring Kafka documents, but owned explicitly so the
# publisher controls send/confirmation and retry. Version is BOM-managed by the
# Spring Boot BOM; nothing is pinned inline.
kafka-clients = { module = "org.apache.kafka:kafka-clients" }
# Testcontainers Kafka (S06-09): an in-process KRaft broker for the outbound
# producer integration suite, on the same apache/kafka image as Compose. The
# 2.x published module is `org.testcontainers:kafka`, but the Spring Boot BOM's
# Testcontainers import manages the historical artifactId
# `org.testcontainers:testcontainers-kafka` (same as testcontainers-postgresql,
# which depends on the BOM-managed name). We use that BOM-managed coordinate so
# no version is pinned inline. No H2 and no hardcoded broker — AGENTS.md.
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
# Event contract tests (S06-13): a JSON Schema validator for the committed envelope contract
# (`contracts/events/json-schema/`). Uses the Jackson 3 (`tools.jackson`) line (3.0.8) to match the
# application's Jackson 3 (tools.jackson) — pairing it with Jackson 2 would introduce a split package
# (`com.fasterxml.jackson.databind` present in both Jackson 2 and Jackson 3) on the test classpath.
# Supports draft 2020-12 (the envelope's `$schema`) via the `SchemaRegistry` / `Schema` / `Result`
# API. Test-only: it validates producer fixtures against the schema, so a breaking envelope change
# fails CI. Apache-2.0.
json-schema-validator = { module = "com.networknt:json-schema-validator", version = "3.0.8" }

[plugins]
# Gradle plugin versions live here too, so a module applies the Boot plugin
# without a version string and the plugin version cannot drift from the matching
# Boot BOM version.
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
